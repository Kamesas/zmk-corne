# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Logging for debugging
CONFIG_ZMK_USB_LOGGING=y

# Bluetooth power - recommended default
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable 2Mbps PHY - fixes pairing with Realtek/Intel adapters
CONFIG_BT_CTLR_PHY_2M=n

# Increase BLE connection stability
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n


# Mouse emulation support
CONFIG_ZMK_POINTING=y

# Battery reporting (both halves). nice_nano v2 has an onboard voltage
# divider on P0.31 gated by P0.13; the `vbatt` node is already declared in
# the upstream nice_nano_v2.dts, so enabling this flips it on. P0.31 must
# NOT be used as a matrix pin — see corne_handwired.dtsi.
CONFIG_ZMK_BATTERY_REPORTING=y

# Central pulls peripheral battery levels over the split link so the OLED
# widget on the left half can show the right cell. Also re-publish them to
# the host's BAS so OS-level battery indicators show both halves.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Encoder support - using hardware QDEC driver
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED display status screen settings live in Kconfig.defconfig (gated on the
# right shield) so they apply reliably regardless of which .conf gets merged.
