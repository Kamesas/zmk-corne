# Runtime settings for both halves. ZMK merges config/<base name>.conf for
# corne_handwired_left and corne_handwired_right. A .conf inside the shield
# folder is only merged when named with the FULL shield name, so shared
# settings must live here (shield defaults live in Kconfig.defconfig).
#
# Keep this file minimal: Zephyr 4.1 aborts the build on any Kconfig
# warning, so a setting the current tree cannot honor breaks CI. Add new
# settings one at a time and watch the build.

# Mouse emulation support
CONFIG_ZMK_POINTING=y

# Battery reporting (both halves). The nice_nano//zmk board variant already
# provides the vbatt node (v2 measures the cell through VDDH, no ADC pin
# needed), so enabling this is enough.
CONFIG_ZMK_BATTERY_REPORTING=y
