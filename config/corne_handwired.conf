# Runtime settings for both halves. ZMK merges config/<base name>.conf for
# corne_handwired_left and corne_handwired_right. A .conf inside the shield
# folder is only merged when named with the FULL shield name, so shared
# settings must live here (shield defaults live in Kconfig.defconfig).

# Enable deep sleep
CONFIG_ZMK_SLEEP=y

# Logging for debugging
CONFIG_ZMK_USB_LOGGING=y

# Bluetooth power - recommended default
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Disable 2Mbps PHY - fixes pairing with Realtek/Intel adapters
CONFIG_BT_CTLR_PHY_2M=n

# Increase BLE connection stability
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Mouse emulation support
CONFIG_ZMK_POINTING=y

# Battery reporting (both halves). nice_nano v2 has an onboard voltage
# divider on P0.31 gated by P0.13; the `vbatt` node is already declared in
# the upstream nice_nano_v2.dts, so enabling this flips it on. P0.31 must
# NOT be used as a matrix pin — see corne_handwired.dtsi.
CONFIG_ZMK_BATTERY_REPORTING=y
